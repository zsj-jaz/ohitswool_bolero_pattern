<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Oh It's Wool Pattern Generator</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- HTML to PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

  <main class="app">
    <section class="form-panel">
      <div class="measurement-title">Body Measurements</div>
      <div class="measurement-box">


        <div class="measurement-row">
          <label for="bust">bust</label>
          <input id="bust" type="number" value="83">
          <span>cm</span>
        </div>

        <div class="measurement-row">
          <label for="shoulder">shoulder seam width</label>
          <input id="shoulder" type="number" value="28">
          <span>cm</span>
        </div>

        <div class="measurement-row">
          <label for="armhole">armhole</label>
          <input id="armhole" type="number" value="28">
          <span>cm</span>
        </div>

        <div class="measurement-row">
          <label for="upperarm">upper arm circ.</label>
          <input id="upperarm" type="number" value="28">
          <span>cm</span>
        </div>


      </div>
      <div class="gauge-title">Gauge</div>
      <div class="gauge-box">


        <table class="gauge-table">
          <thead>
            <tr>
              <th></th>
              <th>st count</th>
              <th>cm</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <th>across</th>
              <td>
                <input id="gaugeAcrossSts" type="number" value="15">
              </td>
              <td>
                <input id="gaugeAcrossCm" type="number" value="6.5" step="0.1">
              </td>
            </tr>

            <tr>
              <th>down</th>
              <td>
                <input id="gaugeDownRows" type="number" value="20">
              </td>
              <td>
                <input id="gaugeDownCm" type="number" value="6.5" step="0.1">
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <button id="downloadBtn">
        Download PDF
      </button>
    </section>

    <section class="preview-panel">
      <div id="preview" class="pattern-preview">
        Loading pattern...
      </div>
    </section>
  </main>

  <script src="formulas.js"></script>
  <script src="app.js"></script>

</body>

</html>
