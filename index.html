<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Pattern Generator</title>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 30px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Custom Knitting Pattern</h1>

  <label for="bust">Bust measurement (cm)</label>
  <input
    type="number"
    id="bust"
    value="83"
  >

  <label for="shoulder">Shoulder seam to shoulder seam (cm)</label>
  <input
    type="number"
    id="shoulder"
    value="28"
  >

  <button onclick="generatePDF()">
    Generate Pattern PDF
  </button>


  <script>
    function generatePDF() {

      const bust =
        document.getElementById("bust").value;

      const shoulder =
        document.getElementById("shoulder").value;


      // Example pattern calculation
      const stitches =
        Math.round(bust * 2);


      // Create PDF
      const { jsPDF } = window.jspdf;

      const pdf = new jsPDF();


      pdf.setFontSize(22);
      pdf.text(
        "Custom Knitting Pattern",
        20,
        25
      );


      pdf.setFontSize(12);

      pdf.text(
        `Bust: ${bust} cm`,
        20,
        45
      );

      pdf.text(
        `Shoulder seam: ${shoulder} cm`,
        20,
        55
      );


      pdf.setFontSize(16);

      pdf.text(
        "Your Pattern",
        20,
        75
      );


      pdf.setFontSize(12);

      pdf.text(
        `Cast on ${stitches} stitches.`,
        20,
        90
      );

      pdf.text(
        "Work in stockinette stitch.",
        20,
        100
      );


      // Download
      pdf.save("my-custom-pattern.pdf");
    }
  </script>

</body>
</html>
