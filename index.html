<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Oh It's Wool Pattern Generator</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- HTML to PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

  <main class="app">
    <section class="form-panel">
      <h1>Oh It's Wool 🧶</h1>
      <h2>Bolero Pattern Generator</h2>

      <label>
        Bust measurement, cm
        <input id="bust" type="number" value="83" />
      </label>

      <label>
        Shoulder seam to shoulder seam, cm
        <input id="shoulder" type="number" value="28" />
      </label>

      <label>
        Gauge, stitches per 10 cm
        <input id="gauge" type="number" value="23" />
      </label>

      <button id="downloadBtn">
        Download PDF
      </button>
    </section>

    <section class="preview-panel">
      <div id="preview" class="pattern-preview">
        Loading pattern...
      </div>
    </section>
  </main>

  <script src="formulas.js"></script>
  <script src="app.js"></script>

</body>

</html>
